# Render.com Blueprint — deploy de 1 clique
# Serviço web Node.js
services:
  - type: web
    name: foxyn
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        fromService:
          type: web
          name: foxyn
          property: url
